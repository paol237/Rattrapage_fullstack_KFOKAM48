<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des tickets</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b5cad'/%3E%3Ccircle cx='5' cy='5' r='1.4' fill='%23fff'/%3E%3Ccircle cx='11' cy='7' r='1.4' fill='%23fff'/%3E%3Ccircle cx='6' cy='11' r='1.4' fill='%23fff'/%3E%3Cpath d='M5 5l6 2m-6 2l1-4M6 11l5-4' stroke='%23fff' stroke-width='.8'/%3E%3C/svg%3E" />
    <script>
      /* Theme applique avant le premier rendu : pas de flash au chargement. */
      (function () {
        try {
          var mode = localStorage.getItem('theme') || 'systeme';
          var sombre =
            mode === 'sombre' ||
            (mode === 'systeme' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (sombre) document.documentElement.classList.add('theme-sombre');
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          /* stockage indisponible : theme clair par defaut */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
