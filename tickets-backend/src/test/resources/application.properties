# ==================================================================
# Configuration des tests uniquement (classpath test > main) :
# base H2 en memoire — les tests se lancent manuellement sans le
# conteneur PostgreSQL. Le ddl-auto=create-drop reconstruit le
# schema a chaque suite, aucune donnee de developpement n'est liee
# aux tests, la logique metier est intacte.
# ==================================================================
spring.application.name=tickets

spring.datasource.url=jdbc:h2:mem:tickets;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
